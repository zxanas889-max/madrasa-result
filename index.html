function vLogin(){const T={s:['🎓','Student'],t:['👨‍🏫','Teacher'],a:['🛡️','Admin']}[lr];

function tp(){const e=$('#p'),h=e.type=='password';e.type=h?'text':'password';$('#sh').textContent=h?'Hide':'Show'}
async function go(){const u=$('#u').value.trim().toLowerCase(),h=await H($('#p').value),lc=+($('#lc')||{}).value,er=t=>{$('#err').textContent=t};
if(lr=='a'){if(u==D.admin.u&&h==D.admin.h){S={role:'a'};tab='ov'}else return er('Incorrect admin username or password')}
else{if(!lc)return er('Please select the class first');
if(lr=='t'){const a=D.ca[lc];if(a&&a.u.toLowerCase()==u&&a.h==h){S={role:'c',c:lc};cls=lc;tab='ml'}else return er('Incorrect teacher username or password for Class '+lc)}
else{const s=D.students.find(x=>x.u.toLowerCase()==u&&x.h==h);if(!s||s.c!=lc)return er(s?'This login does not belong to the selected class':'Incorrect username or password');S={role:'s',id:s.id}}}
sv();render()}

function img(f,mx,cb){const r=new FileReader();r.onerror=()=>toast('Could not read the file');r.onload=()=>{const im=new Image();im.onerror=()=>toast('Unsupported image. Please use JPG or PNG');im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)}
function setSp(id,i){const f=i.files[0];if(f)img(f,240,d=>{D.students.find(x=>x.id==id).p=d;toast('Photo added. Press Publish to show it');render()})}
async function exCls(){const d=await (window.claude?claude.use('downloads'):null);if(!d)return toast('Download unavailable here');try{await d.save({filename:'class'+cls+'-data.json',data:new Blob([JSON.stringify({c:cls,sub:sub(cls),st:D.students.filter(s=>s.c==cls)})],{type:'application/json'})})}catch(e){}}
function impEx(i){const f=i.files[0];if(f)f.text().then(t=>{try{const o=JSON.parse(t);if(!(o.c>=1&&o.c<=NC)||!Array.isArray(o.st))throw 0;D.students=D.students.filter(s=>s.c!=o.c);o.st.forEach(s=>{s.id=D.nid++;s.c=o.c;D.students.push(s)});D.cs[o.c]=o.sub;toast('Class '+o.c+' updated');render()}catch(e){toast('Invalid file')}})}
const PJ='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.';
const loadPdf=()=>window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src=PJ+'min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PJ+'worker.min.js';ok()};s.onerror=no;document.head.appendChild(s)});
const num=x=>/^\d+(\.\d+)?$/.test(x);
async function readIm(){const f=$('#fl').files[0];if(!f)return toast('Choose a file first');const uh=$('#uh').checked;let pages=[];toast('Reading…');
try{if(/\.pdf$/i.test(f.name)){await loadPdf();const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
for(let i=1;i<=pdf.numPages;i++){const tc=await(await pdf.getPage(i)).getTextContent();const its=tc.items.filter(x=>x.str.trim()).map(x=>({s:x.str.trim(),x:x.transform[4],y:x.transform[5]})).sort((a,b)=>b.y-a.y);
const L=[];let py=null;for(const it of its){if(py===null||Math.abs(it.y-py)>3){L.push([]);py=it.y}L[L.length-1].push(it)}
pages.push(L.map(r=>r.sort((a,b)=>a.x-b.x).map(i=>i.s)))}}
else pages=[(await f.text()).split(/\r?\n/).map(l=>l.split(/\t|,|\s{2,}/).map(x=>x.trim()).filter(Boolean)).filter(r=>r.length)]}catch(e){return toast('Could not read this file')}
const rows=[];let hdr=null;
pages.forEach(P=>{const m=P.flat().join(' ').match(/class\s*[-:.]?\s*(\d{1,2})/i),c=S.role=='a'&&m&&+m[1]>=1&&+m[1]<=NC?+m[1]:cls;
P.forEach(r=>{let i=0,roll=null;if(num(r[0])&&r.length>2&&!num(r[1])){roll=+r[0];i=1}const nm=[];while(i<r.length&&!num(r[i]))nm.push(r[i++]);const ms=[];while(i<r.length&&num(r[i]))ms.push(+r[i++]);
if(nm.length&&ms.length)rows.push({c,roll,n:nm.join(' '),ms});else if(!rows.length&&!hdr&&r.length>=3&&r.every(x=>!num(x)))hdr=r})});
const hs=uh&&hdr?hdr.filter(x=>!/^(sl|s\.?\s*no|no\.?$|roll|name|total|rank|result|grade|%|percent|status|pass)/i.test(x)):null;
IM={rows,hs};if(!rows.length)toast('No student rows found. Try a CSV instead.');render()}
function vIm(){const R=IM.rows,by={};R.forEach(r=>by[r.c]=(by[r.c]||0)+1);
return `<div style="margin-top:14px"><b>${R.length} students found</b> <span class="mut">(${Object.entries(by).map(([c,n])=>'Class '+c+': '+n).join(', ')||'none'})</span><p class="mut">Subjects: ${IM.hs?IM.hs.map(esc).join(', '):'each class\'s own subjects, in order'}</p><div class="wrap"><table><thead><tr><th>Class</th><th>Roll</th><th>Name</th><th>Marks</th></tr></thead><tbody>${R.slice(0,8).map(r=>`<tr><td>${r.c}</td><td>${r.roll??'–'}</td><td>${esc(r.n)}</td><td>${r.ms.slice(0,(IM.hs||sub(r.c)).length).join(', ')}</td></tr>`).join('')}</tbody></table></div>${R.length?`<button class="b" onclick="doIm()" style="margin-top:10px">Import ${R.length} students</button>`:''}</div>`}
async function doIm(){const{rows,hs}=IM;CR=[];let a=0;
for(const r of rows){const subs=hs||sub(r.c);if(hs)hs.forEach(s=>{if(!sub(r.c).includes(s))(D.cs[r.c]=sub(r.c)).push(s)});let s=D.students.find(x=>x.c==r.c&&x.n.toLowerCase()==r.n.toLowerCase());
if(!s){const roll=r.roll||D.students.filter(x=>x.c==r.c).length+1;let un=(r.n.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8)||'stu')+r.c+'r'+roll;while(un==D.admin.u||Object.values(D.ca).some(a=>a.u==un)||D.students.some(x=>x.u==un))un+='x';const pw=String(100000+Math.floor(Math.random()*900000));
s={id:D.nid++,n:r.n,r:roll,c:r.c,u:un,h:await H(pw),m:{}};D.students.push(s);CR.push([r.n,r.c,roll,un,pw]);a++}
subs.forEach((j,i)=>{if(r.ms[i]!==undefined)s.m[j]=Math.min(r.ms[i],MX(r.c,j))})}
IM=null;tab=a?'cr':'rk';render();toast(rows.length+' students processed, '+a+' new')}
async function dlCsv(){const d=await (window.claude?claude.use('downloads'):null),csv='Name,Class,Roll,Username,Password\n'+CR.map(r=>r.map(x=>'"'+x+'"').join(',')).join('\n');
if(!d)return toast('Download unavailable: copy from the table');try{await d.save({filename:'new-student-logins.csv',data:new Blob([csv],{type:'text/csv'})})}catch(e){toast('Not saved: copy from the table')}}
async function dlHtml(){D.ts=Date.now();const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#toast').textContent='';c.querySelector('#toast').removeAttribute('style');c.querySelectorAll('#intro,script[src]').forEach(x=>x.remove());c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
const html='<!DOCTYPE html>'+c.outerHTML,d=window.claude?await claude.use('downloads'):null;
if(d){try{await d.save({filename:'marklist.html',data:new Blob([html],{type:'text/html'})})}catch(e){toast('Download failed')}}else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='marklist.html';a.click()}}
async function pub(){D.ts=Date.now();const a=window.claude?await claude.use('artifact'):null;if(!a)return toast('Sign in to claude.ai as the owner to publish');
const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#toast').textContent='';c.querySelector('#toast').removeAttribute('style');
c.querySelectorAll('#intro,script[src]').forEach(x=>x.remove());c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
toast('Publishing…');try{await a.publish('<!DOCTYPE html>'+c.outerHTML)}catch(e){toast(e.code=='conflict'?'Someone else published first. Reloading…':'Publish failed ('+(e.code||'error')+'). Only the owner or an editor signed in to claude.ai can publish.')}}
const seen=()=>{try{if(sessionStorage.getItem('seen'))return 1;sessionStorage.setItem('seen','1')}catch(e){}return 0};
render();if(!S&&!seen())intro();
</script></body></html>
